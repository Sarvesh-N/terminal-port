name: deploy the image

on:
  workflow_run:
    workflows:
      - build-test-image
    types:
      completed 

permissions:
  id-token: write 
  contents: read 

jobs:
  deploy_image_to_ecs:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: checking out code
        uses: actions/checkout@v4

      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build image 
        run: docker built -t demo-img .

      - name: tag image 
        run: |
          docker tag demo-img:latest ${{ steps.login-ecr.outputs.registry }} ${{ vars.ECR_REPOSITORY }}:latest
      
      - name: push to ecr 
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }} ${{ vars.ECR_REPOSITORY }}:latest

      - name: deploying in ecs
        run: |
          aws-ecs update-service --cluster ${{ vars.ECS_CLUSTER }} ${{ vars.ECS_SERVICE }} --force-new-deployment